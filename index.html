<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Faysal Pharmacy</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Faysal Pharmacy</h1>
    <p>Multan Road, Abdul Hakim</p>
  </header>

  <nav>
    <button onclick="showPage('demandPage')">Demand</button>
    <button onclick="showPage('orderPage')">Purchase Orders</button>
  </nav>


  <!-- DEMAND PAGE -->

  <section id="demandPage" class="page">

    <div class="card">

      <h2>Add Demand</h2>

      <label>Medicine Name</label>
      <input
        id="medicineName"
        type="text"
        placeholder="Medicine name"
      >

      <label>Company</label>
      <input
        id="companyName"
        type="text"
        placeholder="Optional"
      >

      <label>Distributor</label>
      <input
        id="distributorName"
        type="text"
        placeholder="Optional"
      >

      <label>Demand Type</label>

      <div class="types">

        <button
          id="endedButton"
          class="type active"
          onclick="selectType('ended')"
        >
          Ended
        </button>

        <button
          id="lowButton"
          class="type"
          onclick="selectType('low')"
        >
          Low Stock
        </button>

      </div>

      <button
        class="mainButton"
        onclick="addDemand()"
      >
        Add Demand
      </button>

    </div>


    <div class="sectionTitle">

      <div>
        <h2>Current Demands</h2>
        <span id="demandCount">0 items</span>
      </div>

      <button onclick="clearDemands()">
        Clear
      </button>

    </div>


    <div id="demandList"></div>

  </section>



  <!-- PURCHASE ORDER PAGE -->

  <section id="orderPage" class="page hidden">

    <div class="card">

      <h2>New Purchase Order</h2>

      <label>Supplier</label>

      <input
        id="supplierName"
        type="text"
        placeholder="Supplier / Distributor"
      >


      <label>Booking Date</label>

      <input
        id="bookingDate"
        type="date"
        onchange="updateDay()"
      >


      <label>Booking Day</label>

      <input
        id="bookingDay"
        type="text"
        readonly
      >


      <h3>Order Items</h3>

      <div id="orderItems">
        <p class="empty">
          No medicines added.
        </p>
      </div>


      <button
        onclick="addManualItem()"
        class="secondaryButton"
      >
        + Add Medicine
      </button>


      <button
        onclick="openDemandSelector()"
        class="secondaryButton"
      >
        + Add From Demand
      </button>


      <button
        onclick="createOrder()"
        class="mainButton"
      >
        Create Purchase Order
      </button>

    </div>


    <div class="sectionTitle">

      <div>
        <h2>Previous Orders</h2>
        <span id="orderCount">0 orders</span>
      </div>

    </div>


    <div id="ordersList"></div>

  </section>



  <!-- DEMAND SELECTOR -->

  <div
    id="demandModal"
    class="modal hidden"
  >

    <div class="modalBox">

      <div class="modalTop">

        <h2>Select Demand</h2>

        <button onclick="closeDemandSelector()">
          X
        </button>

      </div>

      <div id="selectorList"></div>

    </div>

  </div>



  <!-- MESSAGE -->

  <div id="message"></div>


  <script src="app.js"></script>

</body>
</html>
